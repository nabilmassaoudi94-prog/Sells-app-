
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدير المبيعات الذكي</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--blue:#2563eb;--dark:#0f172a;--card:#fff;--bg:#f1f5f9;--green:#16a34a;--red:#dc2626;--yellow:#ca8a04}
  body{font-family:'Almarai',sans-serif;background:var(--bg);min-height:100vh}

  /* HEADER */
  header{background:linear-gradient(135deg,#1e3a8a,#2563eb);position:sticky;top:0;z-index:100;padding:14px 16px;box-shadow:0 4px 20px rgba(37,99,235,.4)}
  .header-inner{max-width:750px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:10px}
  .logo-icon{background:rgba(255,255,255,.2);border-radius:14px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;backdrop-filter:blur(10px)}
  .logo h1{font-size:16px;font-weight:800;color:#fff}
  .logo p{font-size:11px;color:rgba(255,255,255,.7)}
  .btn-new{background:#fff;color:#2563eb;border:none;border-radius:16px;padding:10px 18px;font-family:'Almarai',sans-serif;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}

  /* AI BAR */
  .ai-bar{background:linear-gradient(135deg,#1e3a8a,#7c3aed);margin:16px;border-radius:20px;padding:14px 16px;box-shadow:0 4px 15px rgba(124,58,237,.3)}
  .ai-bar-inner{max-width:750px;margin:0 auto}
  .ai-label{font-size:11px;color:rgba(255,255,255,.7);font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .ai-input-row{display:flex;gap:8px}
  .ai-input{flex:1;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:11px 14px;color:#fff;font-family:'Almarai',sans-serif;font-size:13px;backdrop-filter:blur(10px)}
  .ai-input::placeholder{color:rgba(255,255,255,.5)}
  .ai-btn{background:#fff;color:#7c3aed;border:none;border-radius:14px;padding:11px 16px;font-family:'Almarai',sans-serif;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap}
  .ai-response{background:rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;margin-top:10px;color:#fff;font-size:13px;line-height:1.7;display:none;border:1px solid rgba(255,255,255,.15)}
  .ai-response.show{display:block}
  .ai-typing{display:inline-block;width:6px;height:14px;background:#fff;border-radius:2px;animation:blink .7s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* TABS */
  .tabs{max-width:750px;margin:0 auto 16px;padding:0 16px;display:flex;gap:8px}
  .tab{flex:1;background:#fff;border:none;border-radius:14px;padding:10px;font-family:'Almarai',sans-serif;font-weight:700;font-size:12px;cursor:pointer;color:#64748b;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.2s}
  .tab.active{background:#2563eb;color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.3)}

  /* STATS */
  main{max-width:750px;margin:0 auto;padding:0 16px 16px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .stat-card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);position:relative;overflow:hidden}
  .stat-card::before{content:'';position:absolute;top:-10px;left:-10px;width:60px;height:60px;border-radius:50%;opacity:.08}
  .stat-card:nth-child(1)::before{background:#2563eb}
  .stat-card:nth-child(2)::before{background:#7c3aed}
  .stat-card:nth-child(3)::before{background:#16a34a}
  .stat-card:nth-child(4)::before{background:#ef4444}
  .stat-icon{font-size:22px;margin-bottom:6px}
  .stat-label{font-size:10px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .stat-value{font-size:22px;font-weight:800;color:#0f172a}
  .stat-unit{font-size:11px;color:#94a3b8;font-weight:400}

  /* SEARCH */
  .search-bar{display:flex;gap:8px;margin-bottom:14px}
  .search-wrap{flex:1;position:relative}
  .search-icon{position:absolute;top:50%;transform:translateY(-50%);right:14px;font-size:14px;pointer-events:none}
  .search-bar input{width:100%;padding:12px 36px 12px 14px;border-radius:16px;border:0;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.07);font-family:'Almarai',sans-serif;font-size:13px}
  .search-bar select{background:#fff;border-radius:16px;border:0;padding:0 12px;font-family:'Almarai',sans-serif;font-size:12px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.07)}

  /* EMPTY */
  .empty{text-align:center;padding:60px 20px;color:#94a3b8}
  .empty-icon{font-size:60px;margin-bottom:14px}
  .empty h2{font-size:17px;font-weight:800;margin-bottom:6px;color:#475569}
  .empty p{font-size:13px}

  /* ORDER CARDS */
  .order-card{background:#fff;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.07);margin-bottom:12px;overflow:hidden;transition:.2s}
  .order-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1)}
  .order-main{padding:16px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .order-avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;font-family:sans-serif}
  .order-info{flex:1;min-width:0}
  .order-name{font-weight:800;font-size:15px;color:#0f172a;margin-bottom:2px}
  .order-phone{font-size:12px;color:#94a3b8;margin-bottom:8px;direction:ltr;text-align:right}
  .badges{display:flex;flex-wrap:wrap;gap:5px}
  .badge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:800}
  .badge-green{background:#dcfce7;color:#16a34a}
  .badge-yellow{background:#fef9c3;color:#ca8a04}
  .badge-red{background:#fee2e2;color:#dc2626}
  .badge-gray{background:#f1f5f9;color:#64748b}
  .badge-blue{background:#dbeafe;color:#1d4ed8}
  .order-right{text-align:left;flex-shrink:0}
  .order-total{font-size:22px;font-weight:800;color:#1e3a8a;line-height:1}
  .order-total span{font-size:11px;font-weight:400;color:#94a3b8}
  .order-remaining{font-size:11px;color:#ef4444;font-weight:800;margin-top:2px}
  .order-date{font-size:10px;color:#94a3b8;margin-top:4px}
  .progress-bar{height:4px;background:#f1f5f9;border-radius:4px;margin:10px 16px 0;overflow:hidden}
  .progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#2563eb,#7c3aed);transition:.5s}

  /* DETAILS */
  .order-details{border-top:1px solid #f1f5f9;padding:14px 16px;background:#fafbfc}
  .detail-title{font-size:10px;font-weight:800;color:#94a3b8;margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase}
  .article-row{background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .article-name{font-weight:800}
  .article-size{color:#94a3b8;font-weight:400;font-size:11px}
  .article-calc{color:#64748b;font-size:12px}
  .note-box{background:linear-gradient(135deg,#fef9c3,#fef3c7);border-radius:12px;padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:10px;border-right:3px solid #f59e0b}

  /* AI INSIGHT BOX */
  .ai-insight{background:linear-gradient(135deg,#ede9fe,#dbeafe);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:12px;color:#3730a3;border-right:3px solid #7c3aed;display:none}
  .ai-insight.show{display:block}
  .ai-insight-title{font-weight:800;margin-bottom:4px;font-size:11px}

  /* ACTION BTNS */
  .action-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .btn-wa{flex:1;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:none;border-radius:12px;padding:11px;font-family:'Almarai',sans-serif;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(34,197,94,.3)}
  .btn-icon{background:#f1f5f9;color:#475569;border:none;border-radius:12px;padding:11px 14px;font-family:'Almarai',sans-serif;font-weight:700;cursor:pointer;font-size:15px;transition:.15s}
  .btn-icon:hover{background:#e2e8f0}
  .btn-icon.blue{background:#dbeafe;color:#1d4ed8}
  .btn-icon.red{background:#fee2e2;color:#dc2626}
  .btn-icon.purple{background:#ede9fe;color:#7c3aed}

  /* OVERLAY */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;justify-content:flex-end;backdrop-filter:blur(4px)}
  .overlay.open{display:flex}
  .sidebar{width:100%;max-width:460px;background:#fff;height:100%;overflow-y:auto;box-shadow:-8px 0 40px rgba(0,0,0,.15)}
  .sidebar-header{position:sticky;top:0;background:#fff;border-bottom:1px solid #f1f5f9;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;z-index:10}
  .sidebar-header h2{font-size:18px;font-weight:800}
  .btn-close{background:#f1f5f9;border:none;width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
  .form-body{padding:20px;display:flex;flex-direction:column;gap:16px}
  .field label{font-size:11px;font-weight:800;color:#64748b;display:block;margin-bottom:6px;letter-spacing:.3px}
  .field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid #f1f5f9;background:#fafbfc;font-family:'Almarai',sans-serif;font-size:13px;font-weight:700;transition:.2s}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#2563eb;background:#fff}
  .field textarea{resize:none;height:80px}
  .section-title{font-size:12px;font-weight:800;color:#374151;padding:8px 0 2px;border-bottom:2px solid #f1f5f9}

  /* ARTICLE BLOCK */
  .article-block{background:#f8fafc;border-radius:16px;padding:14px;margin-bottom:8px;border:1.5px solid #f1f5f9}
  .article-row-form{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:10px;align-items:center}
  .article-prices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .article-subtotal{font-size:12px;color:#2563eb;text-align:left;margin-top:6px;font-weight:800}
  .btn-add-art{background:linear-gradient(135deg,#dbeafe,#ede9fe);border:none;color:#2563eb;font-family:'Almarai',sans-serif;font-weight:800;font-size:12px;cursor:pointer;padding:8px 14px;border-radius:12px}
  .btn-rm-art{background:#fee2e2;color:#dc2626;border:none;border-radius:10px;width:30px;height:30px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;align-self:center;flex-shrink:0}

  /* TOTALS BOX */
  .totals-box{background:linear-gradient(135deg,#1e3a8a,#2563eb);border-radius:20px;padding:18px;color:#fff;box-shadow:0 4px 15px rgba(37,99,235,.3)}
  .totals-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;opacity:.8}
  .totals-row.big{font-size:20px;font-weight:800;opacity:1;border-top:1px solid rgba(255,255,255,.2);padding-top:14px;margin-top:6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn-save{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;border-radius:16px;padding:16px;font-family:'Almarai',sans-serif;font-weight:800;font-size:15px;cursor:pointer;width:100%;box-shadow:0 4px 15px rgba(37,99,235,.35)}

  /* AI SUGGEST */
  .ai-suggest{background:linear-gradient(135deg,#ede9fe,#dbeafe);border-radius:14px;padding:12px 14px;font-size:12px;color:#3730a3;margin-top:-8px;display:none}
  .ai-suggest.show{display:block}

  /* ANALYTICS TAB */
  .analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .ana-card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .ana-card h3{font-size:11px;font-weight:800;color:#94a3b8;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
  .bar-label{width:80px;text-align:right;font-weight:700;color:#374151;font-size:11px;flex-shrink:0}
  .bar-track{flex:1;height:8px;background:#f1f5f9;border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#2563eb,#7c3aed)}
  .bar-val{font-size:10px;color:#64748b;flex-shrink:0;width:40px;text-align:left}
  .top-customer{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9}
  .top-customer:last-child{border:0}
  .tc-avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:800;font-family:sans-serif;flex-shrink:0}
  .tc-name{font-weight:800;font-size:13px;color:#0f172a}
  .tc-val{font-size:11px;color:#64748b}
  .tc-amount{margin-right:auto;font-weight:800;color:#1e3a8a;font-size:14px}

  /* NOTIF */
  .notif{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:16px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
  .notif.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <div>
        <h1>مدير المبيعات الذكي</h1>
        <p id="order-count">مدعوم بالذكاء الاصطناعي</p>
      </div>
    </div>
    <button class="btn-new" onclick="openForm()">+ طلب جديد</button>
  </div>
</header>

<!-- AI BAR -->
<div class="ai-bar">
  <div class="ai-bar-inner">
    <div class="ai-label">✨ المساعد الذكي — اسألني أي شيء عن مبيعاتك</div>
    <div class="ai-input-row">
      <input class="ai-input" id="ai-question" placeholder="مثال: من أكثر زبون اشترى؟ كم الباقي هذا الشهر؟" onkeydown="if(event.key==='Enter')askAI()">
      <button class="ai-btn" onclick="askAI()">✨ سؤال</button>
    </div>
    <div class="ai-response" id="ai-response"></div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('orders',this)">📦 الطلبيات</button>
  <button class="tab" onclick="switchTab('analytics',this)">📊 التحليلات</button>
  <button class="tab" onclick="switchTab('alerts',this)">🔔 التنبيهات</button>
</div>

<main>
  <!-- STATS -->
  <div class="stats" id="stats" style="display:none">
    <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-label">الطلبات</div><div class="stat-value" id="s-count">0</div></div>
    <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-label">القيمة الكلية</div><div class="stat-value" id="s-total">0 <span class="stat-unit">درهم</span></div></div>
    <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-label">المدفوع</div><div class="stat-value" id="s-paid">0 <span class="stat-unit">درهم</span></div></div>
    <div class="stat-card"><div class="stat-icon">⏳</div><div class="stat-label">الباقي</div><div class="stat-value" id="s-rem">0 <span class="stat-unit">درهم</span></div></div>
  </div>

  <!-- SEARCH -->
  <div class="search-bar" id="search-bar" style="display:none">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="بحث بالاسم أو الهاتف..." id="search-input" oninput="renderOrders()">
    </div>
    <select id="filter-select" onchange="renderOrders()">
      <option value="الكل">الكل</option>
      <option>غير مدفوع</option><option>مدفوع جزئياً</option><option>مدفوع بالكامل</option>
      <option>في الانتظار</option><option>قيد التجهيز</option><option>تم الشحن</option><option>تم التسليم</option><option>ملغي</option>
    </select>
  </div>

  <!-- TABS CONTENT -->
  <div id="tab-orders"><div id="orders-list"></div></div>

  <div id="tab-analytics" style="display:none">
    <div class="analytics-grid" id="analytics-content"></div>
  </div>

  <div id="tab-alerts" style="display:none">
    <div id="alerts-content"></div>
  </div>
</main>

<!-- FORM OVERLAY -->
<div class="overlay" id="overlay" onclick="closeIfOutside(event)">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2 id="form-title">إضافة طلبية</h2>
      <button class="btn-close" onclick="closeForm()">✕</button>
    </div>
    <div class="form-body">
      <input type="hidden" id="edit-id">

      <div class="section-title">👤 معلومات الزبون</div>
      <div class="field"><label>اسم الزبون *</label>
        <input type="text" id="f-name" placeholder="مثال: محمد العلوي" oninput="aiSuggestCustomer()">
      </div>
      <div class="ai-suggest" id="ai-name-suggest"></div>
      <div class="field"><label>رقم الهاتف *</label>
        <input type="tel" id="f-phone" placeholder="0612345678" dir="ltr">
      </div>

      <div class="section-title">🛍️ المنتجات</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:12px;color:#64748b;font-weight:700">أضف المنتجات المطلوبة</span>
        <button class="btn-add-art" onclick="addArticle()">+ إضافة منتج</button>
      </div>
      <div id="articles-container"></div>

      <div class="totals-box">
        <div class="totals-row"><span>الإجمالي</span><span id="live-total">0 درهم</span></div>
        <div class="totals-row"><span>المدفوع</span><span id="live-paid">0 درهم</span></div>
        <div class="totals-row big"><span>🏦 الباقي</span><span id="live-rem">0 درهم</span></div>
      </div>

      <div class="section-title">💳 الدفع والتسليم</div>
      <div class="field"><label>المبلغ المدفوع (درهم)</label>
        <input type="number" id="f-paid" value="0" min="0" oninput="updateTotals()">
      </div>
      <div class="grid2">
        <div class="field"><label>حالة الدفع</label>
          <select id="f-pstatus">
            <option>غير مدفوع</option><option>مدفوع جزئياً</option><option>مدفوع بالكامل</option>
          </select>
        </div>
        <div class="field"><label>حالة التسليم</label>
          <select id="f-dstatus">
            <option>في الانتظار</option><option>قيد التجهيز</option><option>تم الشحن</option><option>تم التسليم</option><option>ملغي</option>
          </select>
        </div>
      </div>
      <div class="field"><label>التاريخ</label><input type="date" id="f-date"></div>
      <div class="field"><label>ملاحظات</label><textarea id="f-notes" placeholder="أي تفاصيل إضافية..."></textarea></div>
      <button class="btn-save" onclick="saveOrder()">💾 حفظ الطلب</button>
    </div>
  </div>
</div>

<div class="notif" id="notif"></div>

<script>
const SIZES=['XS','S','M','L','XL','XXL','N/A'];
let orders=JSON.parse(localStorage.getItem('sales_orders')||'[]');
let expandedId=null,articleCount=0,currentTab='orders';

function save(){localStorage.setItem('sales_orders',JSON.stringify(orders));}
function notify(msg,emoji='✅'){const n=document.getElementById('notif');n.textContent=emoji+' '+msg;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2500);}
function badgeClass(s){
  if(s==='مدفوع بالكامل'||s==='تم التسليم')return'badge-green';
  if(['مدفوع جزئياً','قيد التجهيز','تم الشحن'].includes(s))return'badge-yellow';
  if(s==='ملغي')return'badge-red';
  return'badge-gray';
}
function calcTotal(articles){return articles.reduce((s,a)=>s+(parseFloat(a.qty)||0)*(parseFloat(a.unitPrice)||0),0);}
function initials(name){return name?name.trim()[0].toUpperCase():'?';}

// ═══════════════════════════════════════
// AI ENGINE
// ═══════════════════════════════════════
function askAI(){
  const q=document.getElementById('ai-question').value.trim().toLowerCase();
  const box=document.getElementById('ai-response');
  if(!q){box.innerHTML='💬 اكتب سؤالاً أولاً';box.classList.add('show');return;}
  box.innerHTML='<span class="ai-typing"></span> جاري التحليل...';
  box.classList.add('show');

  setTimeout(()=>{
    let ans='';
    const total=orders.reduce((s,o)=>s+(o.totalValue||0),0);
    const paid=orders.reduce((s,o)=>s+(parseFloat(o.amountPaid)||0),0);
    const remaining=orders.reduce((s,o)=>s+(o.remainingBalance||0),0);

    // Top customer by value
    const customerTotals={};
    orders.forEach(o=>{customerTotals[o.customerName]=(customerTotals[o.customerName]||0)+(o.totalValue||0);});
    const topCustomer=Object.entries(customerTotals).sort((a,b)=>b[1]-a[1])[0];

    // Unpaid orders
    const unpaid=orders.filter(o=>o.paymentStatus!=='مدفوع بالكامل');
    const pending=orders.filter(o=>o.deliveryStatus==='في الانتظار'||o.deliveryStatus==='قيد التجهيز');

    if(q.includes('أكثر')||q.includes('top')||q.includes('كبير')){
      if(q.includes('زبون')||q.includes('عميل'))
        ans=topCustomer?`🏆 أكثر زبون شراءً هو <strong>${topCustomer[0]}</strong> بإجمالي <strong>${topCustomer[1].toFixed(0)} درهم</strong>`:'لا يوجد بيانات كافية';
      else if(q.includes('منتج')||q.includes('مبيع')){
        const prod={};orders.forEach(o=>o.articles.forEach(a=>{prod[a.name]=(prod[a.name]||0)+(a.qty||0);}));
        const tp=Object.entries(prod).sort((a,b)=>b[1]-a[1])[0];
        ans=tp?`📦 أكثر منتج مبيعاً هو <strong>${tp[0]}</strong> بكمية <strong>${tp[1]} وحدة</strong>`:'لا يوجد بيانات';
      } else ans=`🏆 أكثر زبون: <strong>${topCustomer?topCustomer[0]:'غير متاح'}</strong> — ${topCustomer?topCustomer[1].toFixed(0)+' درهم':''}`;
    }
    else if(q.includes('باقي')||q.includes('متبقي')||q.includes('دين'))
      ans=`💰 إجمالي المبالغ الباقية: <strong>${remaining.toFixed(0)} درهم</strong> من <strong>${unpaid.length} طلبية</strong> غير مكتملة الدفع`;
    else if(q.includes('مدفوع')||q.includes('تحصيل'))
      ans=`✅ تم تحصيل <strong>${paid.toFixed(0)} درهم</strong> من أصل <strong>${total.toFixed(0)} درهم</strong> — نسبة التحصيل: <strong>${total>0?(paid/total*100).toFixed(1):0}%</strong>`;
    else if(q.includes('تسليم')||q.includes('شحن')||q.includes('انتظار'))
      ans=`🚚 يوجد <strong>${pending.length} طلبية</strong> في انتظار التسليم أو قيد التجهيز`;
    else if(q.includes('كم')||q.includes('عدد')||q.includes('مجموع'))
      ans=`📊 لديك <strong>${orders.length} طلبية</strong> — إجمالي المبيعات: <strong>${total.toFixed(0)} درهم</strong>`;
    else if(q.includes('ملغي')||q.includes('الغاء'))
      ans=`❌ عدد الطلبيات الملغاة: <strong>${orders.filter(o=>o.deliveryStatus==='ملغي').length} طلبية</strong>`;
    else if(q.includes('اليوم')||q.includes('today')){
      const today=new Date().toISOString().split('T')[0];
      const tod=orders.filter(o=>o.date===today);
      ans=`📅 طلبيات اليوم: <strong>${tod.length} طلبية</strong> بقيمة <strong>${tod.reduce((s,o)=>s+(o.totalValue||0),0).toFixed(0)} درهم</strong>`;
    }
    else if(q.includes('نصيح')||q.includes('توصي')||q.includes('ماذا'))
      ans=generateAIAdvice();
    else
      ans=generateAIAdvice();

    box.innerHTML='🤖 '+ans;
  },800);
}

function generateAIAdvice(){
  if(orders.length===0)return'أضف طلبياتك لأبدأ تحليل مبيعاتك وتقديم توصيات ذكية 🚀';
  const remaining=orders.reduce((s,o)=>s+(o.remainingBalance||0),0);
  const unpaid=orders.filter(o=>o.paymentStatus==='غير مدفوع');
  const pending=orders.filter(o=>o.deliveryStatus==='في الانتظار');
  const tips=[];
  if(unpaid.length>0)tips.push(`تابع <strong>${unpaid.length} طلبية</strong> غير مدفوعة لتحصيل <strong>${remaining.toFixed(0)} درهم</strong>`);
  if(pending.length>0)tips.push(`جهّز <strong>${pending.length} طلبية</strong> في انتظار الشحن`);
  const customerTotals={};
  orders.forEach(o=>{customerTotals[o.customerName]=(customerTotals[o.customerName]||0)+(o.totalValue||0);});
  const top=Object.entries(customerTotals).sort((a,b)=>b[1]-a[1])[0];
  if(top)tips.push(`ركّز على زبونك الأول <strong>${top[0]}</strong> — أعلى قيمة شراء`);
  return tips.length>0?'💡 '+tips.join(' | '):'مبيعاتك تسير بشكل ممتاز! استمر 🎉';
}

function aiSuggestCustomer(){
  const name=document.getElementById('f-name').value.trim().toLowerCase();
  const box=document.getElementById('ai-name-suggest');
  if(name.length<2){box.classList.remove('show');return;}
  const matches=orders.filter(o=>o.customerName.toLowerCase().includes(name)&&o.id!==document.getElementById('edit-id').value);
  if(matches.length>0){
    const last=matches[0];
    box.innerHTML=`🤖 زبون موجود: <strong>${last.customerName}</strong> — آخر طلبية: ${last.totalValue} درهم`;
    box.classList.add('show');
    box.onclick=()=>{document.getElementById('f-name').value=last.customerName;document.getElementById('f-phone').value=last.phoneNumber;box.classList.remove('show');};
  } else box.classList.remove('show');
}

function renderOrders(){
  const search=document.getElementById('search-input')?.value.toLowerCase()||'';
  const filter=document.getElementById('filter-select')?.value||'الكل';
  const list=document.getElementById('orders-list');
  const statsEl=document.getElementById('stats');
  const sb=document.getElementById('search-bar');
  document.getElementById('order-count').textContent=orders.length+' طلبية محفوظة';
  if(orders.length>0&&currentTab==='orders'){statsEl.style.display='grid';sb.style.display='flex';}
  else{statsEl.style.display='none';}

  const total=orders.reduce((s,o)=>s+(o.totalValue||0),0);
  const paid=orders.reduce((s,o)=>s+(parseFloat(o.amountPaid)||0),0);
  const rem=orders.reduce((s,o)=>s+(o.remainingBalance||0),0);
  document.getElementById('s-count').textContent=orders.length;
  document.getElementById('s-total').innerHTML=total.toFixed(0)+' <span class="stat-unit">درهم</span>';
  document.getElementById('s-paid').innerHTML=paid.toFixed(0)+' <span class="stat-unit">درهم</span>';
  document.getElementById('s-rem').innerHTML=rem.toFixed(0)+' <span class="stat-unit">درهم</span>';

  const filtered=orders.filter(o=>{
    const ms=o.customerName.toLowerCase().includes(search)||o.phoneNumber.includes(search);
    const mf=filter==='الكل'||o.paymentStatus===filter||o.deliveryStatus===filter;
    return ms&&mf;
  });

  if(filtered.length===0){
    list.innerHTML=`<div class="empty"><div class="empty-icon">📋</div><h2>${orders.length===0?'لا توجد طلبيات بعد':'لا توجد نتائج'}</h2><p>${orders.length===0?'اضغط على طلب جديد للبدء':'جرب بحثاً مختلفاً'}</p></div>`;
    return;
  }

  list.innerHTML=filtered.map(o=>{
    const expanded=expandedId===o.id;
    const pct=o.totalValue>0?Math.min(100,(parseFloat(o.amountPaid)||0)/o.totalValue*100):0;
    const arts=o.articles.map(a=>`
      <div class="article-row">
        <span><span class="article-name">${a.name}</span> <span class="article-size">(${a.size})</span></span>
        <span class="article-calc">${a.qty} × ${a.unitPrice} = <strong>${(a.qty*a.unitPrice).toFixed(0)} درهم</strong></span>
      </div>`).join('');
    const noteHtml=o.notes?`<div class="note-box">📝 <strong>ملاحظة:</strong> ${o.notes}</div>`:'';
    const insightHtml=expanded?`<div class="ai-insight show"><div class="ai-insight-title">🤖 تحليل ذكي</div>${getOrderInsight(o)}</div>`:'';
    const detailsHtml=expanded?`
      <div class="order-details">
        <div class="detail-title">المنتجات</div>${arts}${noteHtml}${insightHtml}
        <div class="action-btns" style="margin-top:10px">
          <button class="btn-wa" onclick="shareOrder('${o.id}')">💬 واتساب</button>
          <button class="btn-icon" onclick="copyOrder('${o.id}')" id="cp-${o.id}">📋</button>
          <button class="btn-icon blue" onclick="editOrder('${o.id}')">✏️</button>
          <button class="btn-icon purple" onclick="printOrder('${o.id}')">🖨️</button>
          <button class="btn-icon red" onclick="deleteOrder('${o.id}')">🗑️</button>
        </div>
      </div>`:'';
    return`<div class="order-card">
      <div class="order-main" onclick="toggleExpand('${o.id}')">
        <div class="order-avatar">${initials(o.customerName)}</div>
        <div class="order-info">
          <div class="order-name">${o.customerName}</div>
          <div class="order-phone">📞 ${o.phoneNumber}</div>
          <div class="badges">
            <span class="badge ${badgeClass(o.paymentStatus)}">${o.paymentStatus}</span>
            <span class="badge ${badgeClass(o.deliveryStatus)}">${o.deliveryStatus}</span>
          </div>
        </div>
        <div class="order-right">
          <div class="order-total">${o.totalValue} <span>درهم</span></div>
          ${o.remainingBalance>0?`<div class="order-remaining">باقي: ${o.remainingBalance} درهم</div>`:'<div style="font-size:11px;color:#16a34a;font-weight:800">✅ مكتمل</div>'}
          <div class="order-date">${o.date}</div>
        </div>
      </div>
      ${pct>0?`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`:''}
      ${detailsHtml}
    </div>`;
  }).join('');
}

function getOrderInsight(o){
  const insights=[];
  if(o.remainingBalance>0)insights.push(`لم يتم تحصيل <strong>${o.remainingBalance} درهم</strong> بعد — أرسل تذكيراً عبر واتساب`);
  if(o.deliveryStatus==='في الانتظار')insights.push('هذه الطلبية لم تُشحن بعد');
  if(o.articles.length>2)insights.push(`طلبية كبيرة تحتوي على <strong>${o.articles.length} منتجات</strong>`);
  const pct=o.totalValue>0?(parseFloat(o.amountPaid)||0)/o.totalValue*100:0;
  if(pct===100)insights.push('✅ تم الدفع بالكامل');
  else if(pct>50)insights.push(`تم دفع ${pct.toFixed(0)}% من القيمة`);
  return insights.length>0?insights.join(' • '):'طلبية عادية بدون ملاحظات خاصة';
}

function openForm(order=null){
  document.getElementById('edit-id').value=order?order.id:'';
  document.getElementById('form-title').textContent=order?'تعديل الطلبية':'إضافة طلبية';
  document.getElementById('f-name').value=order?order.customerName:'';
  document.getElementById('f-phone').value=order?order.phoneNumber:'';
  document.getElementById('f-paid').value=order?order.amountPaid:0;
  document.getElementById('f-pstatus').value=order?order.paymentStatus:'غير مدفوع';
  document.getElementById('f-dstatus').value=order?order.deliveryStatus:'في الانتظار';
  document.getElementById('f-date').value=order?order.date:new Date().toISOString().split('T')[0];
  document.getElementById('f-notes').value=order?order.notes:'';
  articleCount=0;document.getElementById('articles-container').innerHTML='';
  const arts=order?order.articles:[{name:'',size:'M',qty:1,unitPrice:0}];
  arts.forEach(a=>addArticle(a));
  updateTotals();
  document.getElementById('overlay').classList.add('open');
}
function closeForm(){document.getElementById('overlay').classList.remove('open');}
function closeIfOutside(e){if(e.target.id==='overlay')closeForm();}

function addArticle(data=null){
  const id=++articleCount;
  const sizeOpts=SIZES.map(s=>`<option ${data&&data.size===s?'selected':''}>${s}</option>`).join('');
  const div=document.createElement('div');
  div.className='article-block';div.id='art-'+id;
  div.innerHTML=`
    <div class="article-row-form">
      <input type="text" placeholder="اسم المنتج" value="${data?data.name:''}" oninput="updateTotals()" id="art-name-${id}" style="padding:10px 12px;border-radius:12px;border:1.5px solid #f1f5f9;background:#fff;font-family:'Almarai',sans-serif;font-weight:700;font-size:13px;width:100%">
      <select id="art-size-${id}" style="padding:8px 6px;border-radius:12px;border:1.5px solid #f1f5f9;background:#fff;font-family:'Almarai',sans-serif;font-weight:700">${sizeOpts}</select>
      <button class="btn-rm-art" onclick="removeArticle(${id})">✕</button>
    </div>
    <div class="article-prices">
      <div class="field"><label>الكمية</label><input type="number" min="1" value="${data?data.qty:1}" id="art-qty-${id}" oninput="updateTotals()"></div>
      <div class="field"><label>السعر (درهم)</label><input type="number" min="0" value="${data?data.unitPrice:0}" id="art-price-${id}" oninput="updateTotals()"></div>
    </div>
    <div class="article-subtotal" id="art-sub-${id}">= 0 درهم</div>`;
  document.getElementById('articles-container').appendChild(div);
  updateTotals();
}

function removeArticle(id){
  if(document.getElementById('articles-container').children.length>1)
    document.getElementById('art-'+id)?.remove();
  updateTotals();
}

function getArticlesFromForm(){
  const arts=[];
  document.querySelectorAll('[id^="art-name-"]').forEach(el=>{
    const id=el.id.split('-')[2];
    if(!document.getElementById('art-'+id))return;
    const qty=parseFloat(document.getElementById('art-qty-'+id)?.value)||0;
    const price=parseFloat(document.getElementById('art-price-'+id)?.value)||0;
    arts.push({name:el.value,size:document.getElementById('art-size-'+id)?.value||'M',qty,unitPrice:price});
    const sub=document.getElementById('art-sub-'+id);
    if(sub)sub.textContent='= '+(qty*price).toFixed(2)+' درهم';
  });
  return arts;
}

function updateTotals(){
  const arts=getArticlesFromForm();
  const total=calcTotal(arts);
  const paid=parseFloat(document.getElementById('f-paid')?.value)||0;
  const rem=Math.max(0,total-paid);
  document.getElementById('live-total').textContent=total.toFixed(2)+' درهم';
  document.getElementById('live-paid').textContent=paid.toFixed(2)+' درهم';
  document.getElementById('live-rem').textContent=rem.toFixed(2)+' درهم';
}

function saveOrder(){
  const name=document.getElementById('f-name').value.trim();
  const phone=document.getElementById('f-phone').value.trim();
  if(!name||!phone){notify('الرجاء إدخال اسم الزبون ورقم الهاتف','⚠️');return;}
  const articles=getArticlesFromForm();
  const total=calcTotal(articles);
  const paid=parseFloat(document.getElementById('f-paid').value)||0;
  const record={customerName:name,phoneNumber:phone,articles,amountPaid:paid,totalValue:total,
    remainingBalance:Math.max(0,total-paid),paymentStatus:document.getElementById('f-pstatus').value,
    deliveryStatus:document.getElementById('f-dstatus').value,date:document.getElementById('f-date').value,
    notes:document.getElementById('f-notes').value.trim()};
  const editId=document.getElementById('edit-id').value;
  if(editId){orders=orders.map(o=>o.id===editId?{...record,id:editId}:o);}
  else{record.id=Date.now().toString();orders.unshift(record);}
  save();closeForm();renderOrders();notify(editId?'تم تعديل الطلبية':'تم حفظ الطلبية بنجاح');
}

function editOrder(id){const o=orders.find(x=>x.id===id);if(o)openForm(o);}

function deleteOrder(id){
  if(confirm('هل أنت متأكد من حذف هذا الطلب؟')){
    orders=orders.filter(o=>o.id!==id);
    if(expandedId===id)expandedId=null;
    save();renderOrders();notify('تم الحذف','🗑️');
  }
}

function shareOrder(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  const lines=o.articles.map(a=>`  - ${a.name} (${a.size}) × ${a.qty} = ${a.qty*a.unitPrice} درهم`).join('\n');
  const text=`*تأكيد طلبية - ${o.customerName}*\n\n*المنتجات:*\n${lines}\n\n*المجموع:* ${o.totalValue} درهم\n*المدفوع:* ${o.amountPaid} درهم\n*الباقي:* ${o.remainingBalance} درهم\n*حالة التسليم:* ${o.deliveryStatus}\n\nشكراً لتعاملكم معنا! 🙏`;
  if(navigator.share){navigator.share({title:'طلبية '+o.customerName,text}).catch(()=>{});return;}
  window.open('https://wa.me/'+o.phoneNumber.replace(/\D/g,'')+'?text='+encodeURIComponent(text),'_blank');
}

function copyOrder(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  const lines=o.articles.map(a=>`- ${a.name} (${a.size}) × ${a.qty} = ${a.qty*a.unitPrice} درهم`).join('\n');
  const text=`طلبية: ${o.customerName}\nالهاتف: ${o.phoneNumber}\n\n${lines}\n\nالمجموع: ${o.totalValue} درهم\nالمدفوع: ${o.amountPaid} درهم\nالباقي: ${o.remainingBalance} درهم`;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.getElementById('cp-'+id);
    if(btn){btn.textContent='✅';setTimeout(()=>{btn.textContent='📋'},2000);}
    notify('تم النسخ');
  });
}

function printOrder(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  const lines=o.articles.map(a=>`<tr><td>${a.name}</td><td>${a.size}</td><td>${a.qty}</td><td>${a.unitPrice}</td><td>${(a.qty*a.unitPrice).toFixed(0)}</td></tr>`).join('');
  const w=window.open('','_blank');
  w.document.write(`<html dir="rtl"><head><meta charset="UTF-8"><title>طلبية ${o.customerName}</title>
  <style>body{font-family:'Almarai',Arial,sans-serif;padding:30px;color:#111}h1{color:#1e3a8a;font-size:22px}table{width:100%;border-collapse:collapse;margin:20px 0}th,td{padding:10px 14px;border:1px solid #e2e8f0;text-align:right}th{background:#1e3a8a;color:#fff}.total{background:#f8fafc;font-weight:800}.footer{margin-top:30px;color:#94a3b8;font-size:13px;text-align:center}</style></head>
  <body><h1>📦 تأكيد طلبية</h1><p><strong>الزبون:</strong> ${o.customerName} &nbsp;|&nbsp; <strong>الهاتف:</strong> ${o.phoneNumber} &nbsp;|&nbsp; <strong>التاريخ:</strong> ${o.date}</p>
  <table><tr><th>المنتج</th><th>المقاس</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${lines}
  <tr class="total"><td colspan="4">المجموع الكلي</td><td>${o.totalValue} درهم</td></tr>
  <tr class="total"><td colspan="4">المدفوع</td><td>${o.amountPaid} درهم</td></tr>
  <tr class="total"><td colspan="4">الباقي</td><td>${o.remainingBalance} درهم</td></tr></table>
  ${o.notes?`<p><strong>ملاحظات:</strong> ${o.notes}</p>`:''}
  <div class="footer">شكراً لتعاملكم معنا 🙏</div></body></html>`);
  w.document.close();w.print();
}

renderOrders();
</script>
</body>
</html>
