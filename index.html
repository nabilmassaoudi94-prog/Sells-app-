<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدير المبيعات</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Almarai',sans-serif;background:#f1f5f9;min-height:100vh}
  header{background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:100;padding:12px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .header-inner{max-width:700px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:8px}
  .logo-icon{background:#2563eb;color:#fff;border-radius:12px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px}
  .logo h1{font-size:15px;font-weight:800;color:#1e3a8a}
  .logo p{font-size:11px;color:#94a3b8}
  .btn-new{background:#2563eb;color:#fff;border:none;border-radius:16px;padding:10px 18px;font-family:'Almarai',sans-serif;font-weight:800;font-size:13px;cursor:pointer}
  main{max-width:700px;margin:0 auto;padding:16px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .stat-card{background:#fff;border-radius:16px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .stat-label{font-size:11px;color:#94a3b8;margin-bottom:4px}
  .stat-value{font-size:20px;font-weight:800;color:#1e3a8a}
  .stat-unit{font-size:11px;color:#94a3b8;font-weight:400}
  .search-bar{display:flex;gap:8px;margin-bottom:14px}
  .search-bar input{flex:1;padding:12px 14px;border-radius:16px;border:0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05);font-family:'Almarai',sans-serif;font-size:13px}
  .search-bar select{background:#fff;border-radius:16px;border:0;padding:0 12px;font-family:'Almarai',sans-serif;font-size:12px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .empty{text-align:center;padding:60px 20px;color:#94a3b8}
  .empty-icon{font-size:56px;margin-bottom:12px}
  .empty h2{font-size:16px;font-weight:700;margin-bottom:4px}
  .empty p{font-size:12px}
  .order-card{background:#fff;border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:10px;overflow:hidden}
  .order-main{padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .order-name{font-weight:800;font-size:15px;color:#111;margin-bottom:3px}
  .order-phone{font-size:12px;color:#94a3b8;margin-bottom:8px;direction:ltr;text-align:right}
  .badges{display:flex;flex-wrap:wrap;gap:6px}
  .badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700}
  .badge-green{background:#dcfce7;color:#16a34a}
  .badge-yellow{background:#fef9c3;color:#ca8a04}
  .badge-red{background:#fee2e2;color:#dc2626}
  .badge-gray{background:#f1f5f9;color:#64748b}
  .order-right{text-align:left;flex-shrink:0}
  .order-total{font-size:20px;font-weight:800;color:#1e3a8a}
  .order-remaining{font-size:11px;color:#ef4444;font-weight:700}
  .order-date{font-size:11px;color:#94a3b8;margin-top:2px}
  .order-details{border-top:1px solid #f1f5f9;padding:14px 16px;background:#f8fafc}
  .detail-title{font-size:11px;font-weight:800;color:#94a3b8;margin-bottom:8px}
  .article-row{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;font-size:13px}
  .article-name{font-weight:700}
  .article-size{color:#94a3b8;font-weight:400}
  .article-calc{color:#64748b}
  .note-box{background:#fef9c3;border-radius:12px;padding:10px 12px;font-size:12px;color:#92400e;margin-bottom:10px}
  .action-btns{display:flex;gap:8px;flex-wrap:wrap}
  .btn-wa{flex:1;background:#22c55e;color:#fff;border:none;border-radius:12px;padding:10px;font-family:'Almarai',sans-serif;font-weight:700;font-size:13px;cursor:pointer}
  .btn-copy{background:#e2e8f0;color:#475569;border:none;border-radius:12px;padding:10px 14px;font-family:'Almarai',sans-serif;font-weight:700;cursor:pointer;font-size:15px}
  .btn-edit{background:#dbeafe;color:#1d4ed8;border:none;border-radius:12px;padding:10px 14px;font-family:'Almarai',sans-serif;font-weight:700;cursor:pointer;font-size:15px}
  .btn-del{background:#fee2e2;color:#dc2626;border:none;border-radius:12px;padding:10px 14px;font-family:'Almarai',sans-serif;font-weight:700;cursor:pointer;font-size:15px}
  /* OVERLAY */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;justify-content:flex-end}
  .overlay.open{display:flex}
  .sidebar{width:100%;max-width:440px;background:#fff;height:100%;overflow-y:auto;box-shadow:-4px 0 20px rgba(0,0,0,.1)}
  .sidebar-header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;z-index:10}
  .sidebar-header h2{font-size:18px;font-weight:800}
  .btn-close{background:none;border:none;font-size:24px;cursor:pointer;color:#94a3b8;line-height:1}
  .form-body{padding:20px;display:flex;flex-direction:column;gap:16px}
  .field label{font-size:11px;font-weight:800;color:#64748b;display:block;margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:14px;border:0;background:#f8fafc;font-family:'Almarai',sans-serif;font-size:13px;font-weight:700}
  .field textarea{resize:none;height:80px}
  .article-block{background:#f8fafc;border-radius:16px;padding:12px;margin-bottom:8px}
  .article-row-form{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:8px}
  .article-prices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .article-subtotal{font-size:11px;color:#64748b;text-align:left;margin-top:4px}
  .btn-add-art{background:none;border:none;color:#2563eb;font-family:'Almarai',sans-serif;font-weight:700;font-size:12px;cursor:pointer;padding:4px 0}
  .btn-rm-art{background:#fee2e2;color:#dc2626;border:none;border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;align-self:center}
  .totals-box{background:#1e3a8a;border-radius:20px;padding:16px;color:#fff}
  .totals-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;opacity:.8}
  .totals-row.big{font-size:18px;font-weight:800;opacity:1;border-top:1px solid rgba(255,255,255,.2);padding-top:12px;margin-top:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn-save{background:#2563eb;color:#fff;border:none;border-radius:16px;padding:15px;font-family:'Almarai',sans-serif;font-weight:800;font-size:15px;cursor:pointer;width:100%}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">📦</div>
      <div>
        <h1>مدير المبيعات</h1>
        <p id="order-count">0 طلبية محفوظة</p>
      </div>
    </div>
    <button class="btn-new" onclick="openForm()">+ طلب جديد</button>
  </div>
</header>

<main>
  <div class="stats" id="stats" style="display:none">
    <div class="stat-card"><div class="stat-label">الطلبات</div><div class="stat-value" id="s-count">0</div></div>
    <div class="stat-card"><div class="stat-label">القيمة الكلية</div><div class="stat-value" id="s-total">0 <span class="stat-unit">درهم</span></div></div>
    <div class="stat-card"><div class="stat-label">المدفوع</div><div class="stat-value" id="s-paid">0 <span class="stat-unit">درهم</span></div></div>
    <div class="stat-card"><div class="stat-label">الباقي</div><div class="stat-value" id="s-rem">0 <span class="stat-unit">درهم</span></div></div>
  </div>

  <div class="search-bar" id="search-bar" style="display:none">
    <input type="text" placeholder="بحث بالاسم أو الهاتف..." id="search-input" oninput="renderOrders()">
    <select id="filter-select" onchange="renderOrders()">
      <option value="الكل">الكل</option>
      <option>غير مدفوع</option>
      <option>مدفوع جزئياً</option>
      <option>مدفوع بالكامل</option>
      <option>في الانتظار</option>
      <option>قيد التجهيز</option>
      <option>تم الشحن</option>
      <option>تم التسليم</option>
      <option>ملغي</option>
    </select>
  </div>

  <div id="orders-list"></div>
</main>

<!-- FORM OVERLAY -->
<div class="overlay" id="overlay" onclick="closeIfOutside(event)">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2 id="form-title">إضافة طلبية</h2>
      <button class="btn-close" onclick="closeForm()">✕</button>
    </div>
    <div class="form-body">
      <input type="hidden" id="edit-id">
      <div class="field"><label>اسم الزبون *</label><input type="text" id="f-name" placeholder="مثال: محمد العلوي" required></div>
      <div class="field"><label>رقم الهاتف *</label><input type="tel" id="f-phone" placeholder="0612345678" dir="ltr"></div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <label style="font-size:11px;font-weight:800;color:#64748b">المنتجات *</label>
          <button class="btn-add-art" onclick="addArticle()">+ إضافة منتج</button>
        </div>
        <div id="articles-container"></div>
      </div>
      <div class="totals-box">
        <div class="totals-row"><span>الإجمالي</span><span id="live-total">0 درهم</span></div>
        <div class="totals-row"><span>المدفوع</span><span id="live-paid">0 درهم</span></div>
        <div class="totals-row big"><span>الباقي</span><span id="live-rem">0 درهم</span></div>
      </div>
      <div class="field"><label>المبلغ المدفوع (درهم)</label><input type="number" id="f-paid" value="0" min="0" oninput="updateTotals()"></div>
      <div class="grid2">
        <div class="field"><label>حالة الدفع</label>
          <select id="f-pstatus">
            <option>غير مدفوع</option>
            <option>مدفوع جزئياً</option>
            <option>مدفوع بالكامل</option>
          </select>
        </div>
        <div class="field"><label>حالة التسليم</label>
          <select id="f-dstatus">
            <option>في الانتظار</option>
            <option>قيد التجهيز</option>
            <option>تم الشحن</option>
            <option>تم التسليم</option>
            <option>ملغي</option>
          </select>
        </div>
      </div>
      <div class="field"><label>التاريخ</label><input type="date" id="f-date"></div>
      <div class="field"><label>ملاحظات</label><textarea id="f-notes" placeholder="أي تفاصيل إضافية..."></textarea></div>
      <button class="btn-save" onclick="saveOrder()">💾 حفظ الطلب</button>
    </div>
  </div>
</div>

<script>
const SIZES = ['XS','S','M','L','XL','XXL','N/A'];
let orders = JSON.parse(localStorage.getItem('sales_orders') || '[]');
let expandedId = null;
let articleCount = 0;

function save() { localStorage.setItem('sales_orders', JSON.stringify(orders)); }

function badgeClass(s) {
  if (s==='مدفوع بالكامل'||s==='تم التسليم') return 'badge-green';
  if (['مدفوع جزئياً','قيد التجهيز','تم الشحن'].includes(s)) return 'badge-yellow';
  if (s==='ملغي') return 'badge-red';
  return 'badge-gray';
}

function calcTotal(articles) {
  return articles.reduce((s,a) => s + (parseFloat(a.qty)||0)*(parseFloat(a.unitPrice)||0), 0);
}

function renderOrders() {
  const search = document.getElementById('search-input')?.value.toLowerCase() || '';
  const filter = document.getElementById('filter-select')?.value || 'الكل';
  const list = document.getElementById('orders-list');
  const stats = document.getElementById('stats');
  const sb = document.getElementById('search-bar');
  document.getElementById('order-count').textContent = orders.length + ' طلبية محفوظة';

  if (orders.length > 0) { stats.style.display='grid'; sb.style.display='flex'; }
  else { stats.style.display='none'; sb.style.display='none'; }

  // Stats
  const sc = orders.reduce((s,o)=>s+(o.totalValue||0),0);
  const sp = orders.reduce((s,o)=>s+(parseFloat(o.amountPaid)||0),0);
  const sr = orders.reduce((s,o)=>s+(o.remainingBalance||0),0);
  document.getElementById('s-count').textContent = orders.length;
  document.getElementById('s-total').innerHTML = sc.toFixed(0)+' <span class="stat-unit">درهم</span>';
  document.getElementById('s-paid').innerHTML = sp.toFixed(0)+' <span class="stat-unit">درهم</span>';
  document.getElementById('s-rem').innerHTML = sr.toFixed(0)+' <span class="stat-unit">درهم</span>';

  const filtered = orders.filter(o => {
    const ms = o.customerName.toLowerCase().includes(search) || o.phoneNumber.includes(search);
    const mf = filter==='الكل' || o.paymentStatus===filter || o.deliveryStatus===filter;
    return ms && mf;
  });

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><h2>${orders.length===0?'لا توجد طلبيات بعد':'لا توجد نتائج'}</h2><p>${orders.length===0?'اضغط على طلب جديد للبدء':'جرب بحثاً مختلفاً'}</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(o => {
    const expanded = expandedId === o.id;
    const arts = o.articles.map(a => `
      <div class="article-row">
        <span><span class="article-name">${a.name}</span> <span class="article-size">(${a.size})</span></span>
        <span class="article-calc">${a.qty} × ${a.unitPrice} = <strong>${(a.qty*a.unitPrice).toFixed(0)} درهم</strong></span>
      </div>`).join('');
    const noteHtml = o.notes ? `<div class="note-box">📝 <strong>ملاحظة:</strong> ${o.notes}</div>` : '';
    const detailsHtml = expanded ? `
      <div class="order-details">
        <div class="detail-title">المنتجات</div>
        ${arts}
        ${noteHtml}
        <div class="action-btns" style="margin-top:10px">
          <button class="btn-wa" onclick="shareOrder('${o.id}')">💬 واتساب</button>
          <button class="btn-copy" onclick="copyOrder('${o.id}')" id="cp-${o.id}">📋</button>
          <button class="btn-edit" onclick="editOrder('${o.id}')">✏️</button>
          <button class="btn-del" onclick="deleteOrder('${o.id}')">🗑️</button>
        </div>
      </div>` : '';
    return `
      <div class="order-card">
        <div class="order-main" onclick="toggleExpand('${o.id}')">
          <div>
            <div class="order-name">${o.customerName}</div>
            <div class="order-phone">📞 ${o.phoneNumber}</div>
            <div class="badges">
              <span class="badge ${badgeClass(o.paymentStatus)}">${o.paymentStatus}</span>
              <span class="badge ${badgeClass(o.deliveryStatus)}">${o.deliveryStatus}</span>
            </div>
          </div>
          <div class="order-right">
            <div class="order-total">${o.totalValue} <span style="font-size:12px;font-weight:400">درهم</span></div>
            ${o.remainingBalance>0?`<div class="order-remaining">باقي: ${o.remainingBalance} درهم</div>`:''}
            <div class="order-date">${o.date}</div>
          </div>
        </div>
        ${detailsHtml}
      </div>`;
  }).join('');
}

function toggleExpand(id) {
  expandedId = expandedId === id ? null : id;
  renderOrders();
}

function openForm(order=null) {
  document.getElementById('edit-id').value = order ? order.id : '';
  document.getElementById('form-title').textContent = order ? 'تعديل الطلبية' : 'إضافة طلبية';
  document.getElementById('f-name').value = order ? order.customerName : '';
  document.getElementById('f-phone').value = order ? order.phoneNumber : '';
  document.getElementById('f-paid').value = order ? order.amountPaid : 0;
  document.getElementById('f-pstatus').value = order ? order.paymentStatus : 'غير مدفوع';
  document.getElementById('f-dstatus').value = order ? order.deliveryStatus : 'في الانتظار';
  document.getElementById('f-date').value = order ? order.date : new Date().toISOString().split('T')[0];
  document.getElementById('f-notes').value = order ? order.notes : '';
  articleCount = 0;
  document.getElementById('articles-container').innerHTML = '';
  const arts = order ? order.articles : [{ name:'', size:'M', qty:1, unitPrice:0 }];
  arts.forEach(a => addArticle(a));
  updateTotals();
  document.getElementById('overlay').classList.add('open');
}

function closeForm() { document.getElementById('overlay').classList.remove('open'); }
function closeIfOutside(e) { if(e.target.id==='overlay') closeForm(); }

function addArticle(data=null) {
  const id = ++articleCount;
  const sizeOptions = SIZES.map(s => `<option ${data&&data.size===s?'selected':''}>${s}</option>`).join('');
  const div = document.createElement('div');
  div.className = 'article-block';
  div.id = 'art-'+id;
  div.innerHTML = `
    <div class="article-row-form">
      <input type="text" placeholder="اسم المنتج" value="${data?data.name:''}" oninput="updateTotals()" id="art-name-${id}" style="padding:10px 12px;border-radius:12px;border:0;background:#fff;font-family:'Almarai',sans-serif;font-weight:700;font-size:13px">
      <select id="art-size-${id}" style="padding:8px;border-radius:12px;border:0;background:#fff;font-family:'Almarai',sans-serif;font-weight:700">${sizeOptions}</select>
      <button class="btn-rm-art" onclick="removeArticle(${id})">✕</button>
    </div>
    <div class="article-prices">
      <div class="field"><label>الكمية</label><input type="number" min="1" value="${data?data.qty:1}" id="art-qty-${id}" oninput="updateTotals()"></div>
      <div class="field"><label>السعر (درهم)</label><input type="number" min="0" value="${data?data.unitPrice:0}" id="art-price-${id}" oninput="updateTotals()"></div>
    </div>
    <div class="article-subtotal" id="art-sub-${id}">= 0 درهم</div>`;
  document.getElementById('articles-container').appendChild(div);
  updateTotals();
}

function removeArticle(id) {
  const el = document.getElementById('art-'+id);
  if (document.getElementById('articles-container').children.length > 1) el.remove();
  updateTotals();
}

function getArticlesFromForm() {
  const arts = [];
  document.querySelectorAll('[id^="art-name-"]').forEach(el => {
    const id = el.id.split('-')[2];
    if (!document.getElementById('art-'+id)) return;
    const qty = parseFloat(document.getElementById('art-qty-'+id)?.value)||0;
    const price = parseFloat(document.getElementById('art-price-'+id)?.value)||0;
    arts.push({ name: el.value, size: document.getElementById('art-size-'+id)?.value||'M', qty, unitPrice: price });
    const sub = document.getElementById('art-sub-'+id);
    if(sub) sub.textContent = '= '+(qty*price).toFixed(2)+' درهم';
  });
  return arts;
}

function updateTotals() {
  const arts = getArticlesFromForm();
  const total = calcTotal(arts);
  const paid = parseFloat(document.getElementById('f-paid')?.value)||0;
  const rem = Math.max(0, total - paid);
  document.getElementById('live-total').textContent = total.toFixed(2)+' درهم';
  document.getElementById('live-paid').textContent = paid.toFixed(2)+' درهم';
  document.getElementById('live-rem').textContent = rem.toFixed(2)+' درهم';
}

function saveOrder() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  if (!name || !phone) { alert('الرجاء إدخال اسم الزبون ورقم الهاتف'); return; }
  const articles = getArticlesFromForm();
  const total = calcTotal(articles);
  const paid = parseFloat(document.getElementById('f-paid').value)||0;
  const record = {
    customerName: name, phoneNumber: phone, articles,
    amountPaid: paid, totalValue: total, remainingBalance: Math.max(0, total-paid),
    paymentStatus: document.getElementById('f-pstatus').value,
    deliveryStatus: document.getElementById('f-dstatus').value,
    date: document.getElementById('f-date').value,
    notes: document.getElementById('f-notes').value.trim()
  };
  const editId = document.getElementById('edit-id').value;
  if (editId) {
    orders = orders.map(o => o.id===editId ? {...record, id:editId} : o);
  } else {
    record.id = Date.now().toString();
    orders.unshift(record);
  }
  save(); closeForm(); renderOrders();
}

function editOrder(id) {
  const o = orders.find(x=>x.id===id);
  if(o) openForm(o);
}

function deleteOrder(id) {
  if (confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
    orders = orders.filter(o=>o.id!==id);
    if(expandedId===id) expandedId=null;
    save(); renderOrders();
  }
}

function shareOrder(id) {
  const o = orders.find(x=>x.id===id); if(!o) return;
  const lines = o.articles.map(a=>`  - ${a.name} (${a.size}) × ${a.qty} = ${a.qty*a.unitPrice} درهم`).join('\n');
  const text = `*تأكيد طلبية - ${o.customerName}*\n\n*المنتجات:*\n${lines}\n\n*المجموع:* ${o.totalValue} درهم\n*المدفوع:* ${o.amountPaid} درهم\n*الباقي:* ${o.remainingBalance} درهم\n*حالة التسليم:* ${o.deliveryStatus}\n\nشكراً لتعاملكم معنا! 🙏`;
  if(navigator.share) { navigator.share({title:'طلبية '+o.customerName,text}).catch(()=>{}); return; }
  window.open('https://wa.me/'+o.phoneNumber.replace(/\D/g,'')+'?text='+encodeURIComponent(text),'_blank');
}

function copyOrder(id) {
  const o = orders.find(x=>x.id===id); if(!o) return;
  const lines = o.articles.map(a=>`- ${a.name} (${a.size}) × ${a.qty} = ${a.qty*a.unitPrice} درهم`).join('\n');
  const text = `طلبية: ${o.customerName}\nالهاتف: ${o.phoneNumber}\n\n${lines}\n\nالمجموع: ${o.totalValue} درهم\nالمدفوع: ${o.amountPaid} درهم\nالباقي: ${o.remainingBalance} درهم`;
  navigator.clipboard.writeText(text).then(()=>{
    const btn = document.getElementById('cp-'+id);
    if(btn){btn.textContent='✅';setTimeout(()=>{btn.textContent='📋'},2000);}
  });
}

renderOrders();
</script>
